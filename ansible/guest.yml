---
# Part 2 — runs against the VM over SSH, using the key host.yml generated.
#
#   ansible-playbook guest.yml     # user and key come from inventory.ini
#
# Stops at a working single-node RKE2 with the GPU visible. The OpenShell and
# agent layer is deliberately not automated — see docs/ for why.
- name: Build the SLES guest
  hosts: sles_guest
  become: true
  gather_facts: true
  roles:
    - sles_base
    - nvidia_driver
    - rke2
