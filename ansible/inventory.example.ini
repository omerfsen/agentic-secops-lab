# Copy to inventory.ini and edit. inventory.ini is gitignored.

[kvm_host]
# The physical machine with the GPU. Ansible connects here to build the VM.
kvmhost ansible_host=192.168.1.10 ansible_user=root

[sles_guest]
# The VM itself, once it exists. Must match vm_ip in group_vars.
# cloud-init only provisions a key for the sles user (see vm_user in
# roles/vm_create/defaults/main.yml) — root has no SSH key installed.
secops-lab ansible_host=192.168.1.50 ansible_user=sles ansible_ssh_private_key_file=.keys/secops-lab_ed25519
