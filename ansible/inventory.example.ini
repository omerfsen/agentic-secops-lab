# Copy to inventory.ini and edit. inventory.ini is gitignored.

[kvm_host]
# The physical machine with the GPU. Ansible connects here to build the VM.
kvmhost ansible_host=192.168.1.10 ansible_user=root

[sles_guest]
# The VM itself, once it exists. Must match vm_ip in group_vars.
secops-lab ansible_host=192.168.1.50 ansible_user=root
