# Copy to group_vars/all/vars.yml and edit. That directory is gitignored.
---
# ── VM shape ─────────────────────────────────────────────────────────────
vm_name: secops-lab
vm_vcpus: 16
# Leave the host 16-32 GB. On a 96 GB host, 65536 (64 GB) is a good split and
# is also what MoE expert offload wants — see docs/gpu-sizing.md.
vm_memory_mb: 65536
vm_disk_gb: 500
vm_disk_path: /var/lib/libvirt/images
# Start the guest with the host? Say no on a workstation that hands the GPU
# over on demand — otherwise the guest takes the card at every boot.
vm_autostart: true

# ── Network: bridged, static ─────────────────────────────────────────────
# If this bridge doesn't already exist, host.yml creates it (Debian/Ubuntu
# only — see ansible/README.md#network). Already have one? It's left alone.
vm_bridge: br10
vm_ip: 192.168.1.50
vm_prefix: 24
vm_gateway: 192.168.1.1
vm_dns: [1.1.1.1, 8.8.8.8]
vm_hostname: secops-lab

# Which host NIC to fold into vm_bridge when it has to be created. Empty =
# auto-detect the NIC currently carrying the default route (the common case
# on a fresh single-NIC install). Set explicitly if that guess is wrong.
host_bridge_uplink: ""

# ── GPU passthrough ──────────────────────────────────────────────────────
# Both functions: the GPU and its HDMI audio device. Find them with:
#   lspci -nn | grep -i nvidia
gpu_pci_ids:
  - "0000:01:00.0"
  - "0000:01:00.1"

# How the card is handed over:
#   permanent  the host never loads a driver for it; vfio-pci owns it from
#              boot. One reboot after the first run. Right for a headless box.
#   on-demand  EXPERIMENTAL. The host keeps the card — its own driver, CUDA,
#              nvidia-smi — and libvirt hands it to the guest only while the
#              guest runs. No reboot. Refused unless another GPU is the
#              firmware's primary display and nothing is plugged into the
#              card: a live hand-over of a boot-VGA card with a monitor on it
#              has hard-frozen a host. Prefer permanent + off as a toggle.
#   off        undo either. Removes the config, rebuilds the initrd; the host
#              driver is back after a reboot. host.yml then stops after the
#              host checks and does not build the guest.
gpu_passthrough_mode: permanent

# on-demand only: rehearse the hand-over during host.yml (detach to vfio-pci,
# reattach to the host driver) so a setup that cannot do it fails there, not
# at the first guest start. Seconds; the host loses the card for that long.
gpu_handover_rehearsal: true

# ── KVM host ─────────────────────────────────────────────────────────────
# The host OS is detected automatically; Ubuntu 24.04 LTS and SLES are both
# handled. Only the guest has to be SLES.

# ── SLES image ───────────────────────────────────────────────────────────
# A SLES qcow2 cloud image. Validated by RKE2 v1.36: SLES 16.0, 15 SP7, 15 SP6.
# Use 16.0 — its 6.12 kernel has the Landlock network rules that 15 SP6/SP7 (6.4)
# lack, and Landlock is what the sandbox relies on.
# Download from SUSE Customer Center with your subscription.
sles_image_url: ""           # e.g. https://.../SLES16.0-Minimal-VM.x86_64.qcow2
sles_image_checksum: ""      # sha256:...

# ── Credentials — do not commit ──────────────────────────────────────────
# SUSE Customer Center registration code. A 60-day trial code is issued on
# registration at https://www.suse.com/download/sles/ — no subscription needed
# to build this. The clock starts at registration, not at first boot.
#
# Don't put the real code here — see ansible/README.md#secrets. Create
# group_vars/all/vault.yml (ansible-vault, gitignored either way) with:
#   vault_scc_regcode: "your-code-here"
# then encrypt it: ansible-vault encrypt group_vars/all/vault.yml
scc_regcode: "{{ vault_scc_regcode }}"

# ── Versions ─────────────────────────────────────────────────────────────
rke2_version: ""             # empty = latest stable

# ── Reaching the cluster ─────────────────────────────────────────────────
# guest.yml copies the admin kubeconfig to ansible/<guest>.kubeconfig on the
# control node (gitignored) and makes kubectl work for the login user in the
# guest. It can also install a matching kubectl into /usr/local/bin on the
# control node — off by default since that needs sudo where you run Ansible.
fetch_kubeconfig: true
install_local_kubectl: false

# ── stack.yml: the public pieces of the stack, one switch each ───────────
install_gpu_operator: true     # device plugin etc.; driver and toolkit stay host-managed
install_neuvector: true        # SUSE Security runtime scanning
install_vllm: false            # model serving; pulls ~19 GB on first start — see roles/vllm/defaults
install_openshell: false       # NVIDIA OpenShell gateway (alpha) + Agent Sandbox CRDs + the CLI
