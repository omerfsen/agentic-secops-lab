# Copy to all.yml and edit. all.yml is gitignored — it holds the SCC code.
---
# ── VM shape ─────────────────────────────────────────────────────────────
vm_name: secops-lab
vm_vcpus: 16
# Leave the host 16-32 GB. On a 96 GB host, 65536 (64 GB) is a good split and
# is also what MoE expert offload wants — see docs/gpu-sizing.md.
vm_memory_mb: 65536
vm_disk_gb: 500
vm_disk_path: /var/lib/libvirt/images

# ── Network: bridged, static ─────────────────────────────────────────────
# If this bridge doesn't already exist, host.yml creates it (Debian/Ubuntu
# only — see ansible/README.md#network). Already have one? It's left alone.
vm_bridge: br10
vm_ip: 192.168.1.50
vm_prefix: 24
vm_gateway: 192.168.1.1
vm_dns: [1.1.1.1, 8.8.8.8]
vm_hostname: secops-lab

# Which host NIC to fold into vm_bridge when it has to be created. Empty =
# auto-detect the NIC currently carrying the default route (the common case
# on a fresh single-NIC install). Set explicitly if that guess is wrong.
host_bridge_uplink: ""

# ── GPU passthrough ──────────────────────────────────────────────────────
# Both functions: the GPU and its HDMI audio device. Find them with:
#   lspci -nn | grep -i nvidia
gpu_pci_ids:
  - "0000:01:00.0"
  - "0000:01:00.1"

# ── KVM host ─────────────────────────────────────────────────────────────
# The host OS is detected automatically; Ubuntu 24.04 LTS and SLES are both
# handled. Only the guest has to be SLES.

# ── SLES image ───────────────────────────────────────────────────────────
# A SLES qcow2 cloud image. Validated by RKE2 v1.36: SLES 16.0, 15 SP7, 15 SP6.
# Use 16.0 — its 6.12 kernel has the Landlock network rules that 15 SP6/SP7 (6.4)
# lack, and Landlock is what the sandbox relies on.
# Download from SUSE Customer Center with your subscription.
sles_image_url: ""           # e.g. https://.../SLES16.0-Minimal-VM.x86_64.qcow2
sles_image_checksum: ""      # sha256:...

# ── Credentials — do not commit ──────────────────────────────────────────
# SUSE Customer Center registration code. A 60-day trial code is issued on
# registration at https://www.suse.com/download/sles/ — no subscription needed
# to build this. The clock starts at registration, not at first boot.
#
# Don't put the real code here — see ansible/README.md#secrets. Create
# group_vars/vault.yml (ansible-vault, gitignored either way) with:
#   vault_scc_regcode: "your-code-here"
# then encrypt it: ansible-vault encrypt group_vars/vault.yml
scc_regcode: "{{ vault_scc_regcode }}"

# ── Versions ─────────────────────────────────────────────────────────────
rke2_version: ""             # empty = latest stable
