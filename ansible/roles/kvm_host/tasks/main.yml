---
# Preflight for GPU passthrough. Every check here fails the play rather than
# warning: a half-configured passthrough produces a VM that boots fine and has
# no usable GPU, which is much harder to diagnose later.

- name: Read GPU vendor:device ids
  ansible.builtin.include_tasks: vendor_ids.yml

- name: Install virtualisation packages
  ansible.builtin.package:
    name: "{{ kvm_host_packages }}"
    state: present

- name: Ensure libvirt is running
  ansible.builtin.systemd:
    name: "{{ libvirt_service }}"
    state: started
    enabled: true

- name: Add the invoking user to the libvirt group
  ansible.builtin.user:
    name: "{{ ansible_env.SUDO_USER | default(ansible_user_id) }}"
    groups: "{{ libvirt_group }}"
    append: true
  when: ansible_env.SUDO_USER is defined

# ── Broad sanity check before the granular GPU-specific ones below ────────
- name: Run virt-host-validate
  ansible.builtin.command: virt-host-validate qemu
  register: host_validate
  changed_when: false
  failed_when: false
  check_mode: false

- name: Show virt-host-validate output
  ansible.builtin.debug:
    msg: "{{ host_validate.stdout_lines }}"

- name: Fail if virt-host-validate found a blocking issue
  ansible.builtin.assert:
    that: host_validate.rc == 0
    fail_msg: >-
      virt-host-validate found a blocking issue (a FAIL line above, not just a
      WARN) — this host cannot run KVM guests as currently configured.

# ── IOMMU ────────────────────────────────────────────────────────────────
- name: Check IOMMU is enabled
  ansible.builtin.find:
    paths: /sys/kernel/iommu_groups
    file_type: directory
  register: iommu_groups

- name: Fail if IOMMU is off
  ansible.builtin.assert:
    that: iommu_groups.matched > 0
    fail_msg: >-
      No IOMMU groups found — the GPU cannot be passed through at all.
      On Ubuntu: add intel_iommu=on iommu=pt (or amd_iommu=on for AMD) to
      GRUB_CMDLINE_LINUX_DEFAULT in /etc/default/grub, run update-grub, reboot.
      On SLES: same parameters, then grub2-mkconfig -o /boot/grub2/grub.cfg.
      This play does not edit your bootloader — getting that wrong costs you the
      machine.

# ── The GPU's IOMMU group must contain nothing else ───────────────────────
- name: Resolve the IOMMU group of each requested device
  ansible.builtin.shell: |
    set -o pipefail
    readlink -f /sys/bus/pci/devices/{{ item }}/iommu_group | xargs basename
  args: {executable: /bin/bash}
  changed_when: false
  check_mode: false
  loop: "{{ gpu_pci_ids }}"
  register: gpu_groups

- name: List every device sharing those groups
  ansible.builtin.shell: |
    set -o pipefail
    ls /sys/kernel/iommu_groups/{{ item }}/devices/
  args: {executable: /bin/bash}
  changed_when: false
  check_mode: false
  loop: "{{ gpu_groups.results | map(attribute='stdout') | unique | list }}"
  register: group_members

- name: Show what is in each group
  ansible.builtin.debug:
    msg: "IOMMU group {{ item.item }} contains: {{ item.stdout_lines | join(', ') }}"
  loop: "{{ group_members.results }}"
  loop_control: {label: "group {{ item.item }}"}

# sysfs lists group members in full DDDD:BB:DD.F form, same as gpu_pci_ids.
- name: Fail if a group contains devices you are not passing through
  ansible.builtin.assert:
    that: item.stdout_lines | difference(gpu_pci_ids) | length == 0
    fail_msg: >-
      IOMMU group {{ item.item }} also contains
      {{ item.stdout_lines | difference(gpu_pci_ids) | join(', ') }}.
      Passthrough is all-or-nothing per group — either add these to gpu_pci_ids
      (if the guest can own them) or move the card to a slot with cleaner
      grouping. Consumer boards frequently group the GPU with a PCIe port or an
      NVMe controller.
  loop: "{{ group_members.results }}"
  loop_control: {label: "group {{ item.item }}"}

# ── Is the card also the firmware's boot display? ─────────────────────────
- name: Check whether a passthrough function is the boot VGA device
  ansible.builtin.shell: |
    set -o pipefail
    cat /sys/bus/pci/devices/{{ item }}/boot_vga 2>/dev/null || echo 0
  args: {executable: /bin/bash}
  changed_when: false
  check_mode: false
  loop: "{{ gpu_pci_ids }}"
  register: boot_vga

- name: Warn if the firmware framebuffer sits on the card being passed through
  ansible.builtin.debug:
    msg: >-
      {{ item.item }} is the boot VGA device, so the firmware console
      framebuffer lives on the card you are handing to the guest. This usually
      still works on a 6.x kernel, but if the guest later fails to start with
      "can't reserve BAR" errors: make another GPU (an iGPU, if there is one)
      the primary display in firmware, or add
      initcall_blacklist=simpledrm_platform_driver_init to the kernel cmdline
      — this play won't edit your bootloader. Either way, a local host console
      needs to be on a different GPU from now on; this one goes dark once
      vfio-pci owns it.
  loop: "{{ boot_vga.results }}"
  loop_control: {label: "{{ item.item }}"}
  when: item.stdout | trim == '1'

# ── Nothing on the host may hold the card ────────────────────────────────
# No hard-fail here on purpose: on a genuinely first run the GPU is *expected*
# to still be on the host driver (nvidia/nouveau) — that's exactly the state
# the blacklist + vfio.conf tasks below fix. Failing before they even get a
# chance to run would make the "reboot and run again" flow described in
# host.yml and README.md impossible to reach. The real gate is the assert at
# the bottom, after a reboot has had a chance to apply the new config.
- name: Check which driver currently owns each function
  ansible.builtin.shell: |
    set -o pipefail
    basename "$(readlink -f /sys/bus/pci/devices/{{ item }}/driver 2>/dev/null)" 2>/dev/null || echo none
  args: {executable: /bin/bash}
  changed_when: false
  check_mode: false
  loop: "{{ gpu_pci_ids }}"
  register: current_drivers

- name: Report current driver binding
  ansible.builtin.debug:
    msg: >-
      {{ item.item }} -> {{ item.stdout }}
      {{ '(host driver still owns this — expected before the first reboot)'
         if item.stdout not in ['vfio-pci', 'none'] else '' }}
  loop: "{{ current_drivers.results }}"
  loop_control: {label: "{{ item.item }}"}

- name: Blacklist host GPU drivers
  ansible.builtin.copy:
    dest: /etc/modprobe.d/blacklist-gpu-passthrough.conf
    mode: "0644"
    content: |
      blacklist nouveau
      blacklist nvidia
      blacklist nvidia_drm
      blacklist nvidia_modeset
      options nouveau modeset=0
  register: gpu_blacklist

# The softdeps cover anything that still loads a driver by name despite the
# blacklist (nvidia-modprobe, udev coldplug of the HDMI audio function via
# snd_hda_intel): vfio-pci is loaded first and claims the ids, so the other
# driver finds nothing left to bind.
- name: Bind the devices to vfio-pci at boot
  ansible.builtin.copy:
    dest: /etc/modprobe.d/vfio.conf
    mode: "0644"
    content: |
      options vfio-pci ids={{ vfio_device_ids | join(',') }} disable_vga=1
      softdep nvidia pre: vfio-pci
      softdep nouveau pre: vfio-pci
      softdep snd_hda_intel pre: vfio-pci
  vars:
    vfio_device_ids: "{{ gpu_vendor_device_ids.results | map(attribute='stdout') | list }}"
  register: vfio_bind

# With the host driver blacklisted nothing would pull vfio-pci in on its own
# at boot — load it explicitly so it claims the card before anything else.
- name: Load vfio-pci at boot
  ansible.builtin.copy:
    dest: /etc/modules-load.d/vfio-pci.conf
    mode: "0644"
    content: |
      vfio-pci
  register: vfio_modload

# A plain task rather than a handler: handlers are skipped when a play fails,
# and the assert below fails by design on a first run. The initrd has to be
# rebuilt before that point or the reboot changes nothing.
- name: Rebuild the initrd so the new modprobe config is in it
  ansible.builtin.command: "{{ initrd_rebuild_cmd }}"
  when: gpu_blacklist.changed or vfio_bind.changed or vfio_modload.changed
  changed_when: true

- name: Confirm vfio-pci is bound to every requested function
  ansible.builtin.shell: |
    set -o pipefail
    basename "$(readlink -f /sys/bus/pci/devices/{{ item }}/driver 2>/dev/null)" 2>/dev/null || echo none
  args: {executable: /bin/bash}
  changed_when: false
  check_mode: false
  loop: "{{ gpu_pci_ids }}"
  register: final_drivers

- name: Report binding state
  ansible.builtin.debug:
    msg: >-
      {{ item.item }} -> {{ item.stdout }}
      {{ '(ready)' if item.stdout == 'vfio-pci' else '(NOT bound — reboot required after the initrd rebuild)' }}
  loop: "{{ final_drivers.results }}"
  loop_control: {label: "{{ item.item }}"}

# This is the real gate. Failing here on a first run is expected and correct:
# the modprobe config above only takes effect after a reboot, and vm_create
# must not run against a GPU the host driver still owns.
- name: Stop here until the GPU is actually on vfio-pci
  ansible.builtin.assert:
    that: item.stdout == 'vfio-pci'
    fail_msg: >-
      {{ item.item }} is still on '{{ item.stdout }}', not vfio-pci. If the
      blacklist/vfio tasks above just changed something, this is the expected
      first-run stop: REBOOT the host, then run host.yml again and it will
      carry on into vm_create. If nothing changed and it still isn't vfio-pci
      after a reboot, the host driver is loading before vfio-pci — check
      `lsinitramfs` (Ubuntu) / `lsinitrd` (SLES) for the vfio.conf options.
  loop: "{{ final_drivers.results }}"
  loop_control: {label: "{{ item.item }}"}
