---
# SUSE Security (NeuVector) from its upstream chart. Single-node sizing: one
# controller, one scanner. The chart generates the admin bootstrap password
# into the neuvector-bootstrap-secret; change it after the first login.

- name: Add the NeuVector Helm repo
  ansible.builtin.command: helm repo add neuvector https://neuvector.github.io/neuvector-helm/ --force-update
  changed_when: false

- name: Write the NeuVector values
  ansible.builtin.copy:
    dest: /etc/secops-lab/neuvector-values.yaml
    mode: "0644"
    content: |
      # chart version: {{ neuvector_chart_version or 'latest' }}
      # RKE2 runs containerd on the k3s socket path.
      runtimePath: /run/k3s/containerd/containerd.sock
      controller:
        replicas: 1
      cve:
        scanner:
          replicas: 1
      manager:
        # Plain HTTP on the manager; Traefik terminates TLS in front of it
        # (the documented way to put the UI behind an ingress).
        env:
          ssl: false
        svc:
          type: NodePort
          nodePort: {{ neuvector_manager_nodeport }}
  register: neuvector_values

- name: Is the NeuVector release deployed?
  ansible.builtin.shell: |
    set -o pipefail
    helm status neuvector -n neuvector -o json | grep -c '"status":"deployed"'
  args: {executable: /bin/bash}
  environment: {KUBECONFIG: /etc/rancher/rke2/rke2.yaml}
  register: neuvector_release
  changed_when: false
  failed_when: false

- name: Install or upgrade NeuVector
  ansible.builtin.command: >-
    helm upgrade --install neuvector neuvector/core
    -n neuvector --create-namespace
    -f /etc/secops-lab/neuvector-values.yaml
    {% if neuvector_chart_version %}--version {{ neuvector_chart_version }}{% endif %}
    --wait --timeout 15m
  environment: {KUBECONFIG: /etc/rancher/rke2/rke2.yaml}
  when: neuvector_values.changed or neuvector_release.stdout | trim != '1'
  changed_when: true

- name: Wait for every NeuVector pod to be ready
  ansible.builtin.shell: |
    set -o pipefail
    kubectl get pods -n neuvector --no-headers | awk '{print $3}' | grep -vcE "^Running$|^Completed$" || true
  args: {executable: /bin/bash}
  environment: {KUBECONFIG: /etc/rancher/rke2/rke2.yaml}
  register: nv_pending
  until: nv_pending.stdout | trim == '0'
  retries: 40
  delay: 15
  changed_when: false

# The UI through RKE2's Traefik, by hostname (see defaults for why not a path).
- name: Write the manager ingress
  ansible.builtin.copy:
    dest: /etc/secops-lab/neuvector-ingress.yaml
    mode: "0644"
    content: |
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: neuvector-manager
        namespace: neuvector
        annotations:
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
      spec:
        ingressClassName: traefik
        rules:
          - host: {{ neuvector_ingress_host }}
            http:
              paths:
                - path: /
                  pathType: Prefix
                  backend: {service: {name: neuvector-service-webui, port: {number: 8443}}}
  register: nv_ingress_file

- name: Apply the manager ingress
  ansible.builtin.command: kubectl apply -f /etc/secops-lab/neuvector-ingress.yaml
  register: nv_ingress
  changed_when: "'created' in nv_ingress.stdout or 'configured' in nv_ingress.stdout"

- name: Drop the path-prefix middleware an earlier run may have left
  ansible.builtin.command: kubectl delete middleware neuvector-strip -n neuvector --ignore-not-found
  register: nv_mw
  changed_when: "'deleted' in nv_mw.stdout"

- name: Report
  ansible.builtin.debug:
    msg: >-
      NeuVector up. Manager: https://{{ neuvector_ingress_host }}/
      (also http://{{ ansible_host }}:{{ neuvector_manager_nodeport }}). User admin; the chart
      generated the initial password — read it on the guest with
      kubectl -n neuvector get secret neuvector-bootstrap-secret
      -o go-template='{{ '{{' }} .data.bootstrapPassword | base64decode {{ '}}' }}' and change it after
      the first login.
