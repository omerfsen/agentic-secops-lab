---
- name: Confirm we are on SLES
  ansible.builtin.assert:
    that: ansible_facts['distribution'] == 'SLES'
    fail_msg: "Expected SLES, found {{ ansible_facts['distribution'] }}."

- name: Report kernel version
  ansible.builtin.debug:
    msg: >-
      Kernel {{ ansible_facts['kernel'] }}.
      {{ 'Has the post-6.4 Landlock network rules.' if ansible_facts['kernel'] is version('6.12','>=')
         else 'Older than 6.12 — Landlock network rules and scoping are absent; SLES 16.0 is preferable.' }}

# no_log: the JSON includes the registration code.
- name: Read SCC registration status
  ansible.builtin.command: SUSEConnect --status
  register: scc_status
  changed_when: false
  no_log: true

- name: Parse it
  ansible.builtin.set_fact:
    scc_registered: >-
      {{ scc_status.stdout | from_json | selectattr('status', 'equalto', 'Registered')
         | map(attribute='identifier') | list }}

# cloud-init already registered the base product on first boot (vm_create puts
# the code in user-data), so this normally skips. It only runs if that didn't
# happen — an image without cloud-init, or a seed built without the code.
- name: Register with SCC
  ansible.builtin.command: SUSEConnect -r {{ scc_regcode }}
  when: "'SLES' not in scc_registered"
  no_log: true

- name: Enable required modules
  ansible.builtin.command: SUSEConnect -p {{ item }}
  loop: "{{ sles_modules }}"
  when: item.split('/')[0] not in scc_registered
  register: mod
  changed_when: "'Successfully' in mod.stdout"
  failed_when: mod.rc != 0 and 'already' not in (mod.stdout ~ mod.stderr)

# No iptables (RKE2 ships its own) and no python3-kubernetes (nothing here
# uses the kubernetes.core modules — the rke2 role shells out to kubectl).
- name: Install base packages
  community.general.zypper:
    name: [git, curl, jq, tar, gzip]
    state: present

# ── Resolver ─────────────────────────────────────────────────────────────
# Some home routers drop one of glibc's parallel A+AAAA queries to public
# resolvers, and every lookup then sits through the full 5 s timeout before
# the retry succeeds. Serialising the pair fixes it without changing resolvers.
- name: Is NetworkManager managing the guest network?
  ansible.builtin.command: systemctl is-active NetworkManager
  register: nm_active
  changed_when: false
  failed_when: false

- name: Serialise resolver queries
  ansible.builtin.copy:
    dest: /etc/NetworkManager/conf.d/10-dns-single-request.conf
    mode: "0644"
    content: |
      [global-dns]
      options=single-request
  register: dns_options
  when: nm_active.stdout == 'active'

- name: Reload NetworkManager
  ansible.builtin.systemd:
    name: NetworkManager
    state: reloaded
  when: dns_options.changed | default(false)

# ── Landlock ─────────────────────────────────────────────────────────────
# OpenShell's policies default to best_effort, so a missing LSM degrades
# enforcement silently. That is the single worst failure mode in this build:
# the sandbox reports healthy and is not one. Fail here instead.
- name: Read the active LSM list
  ansible.builtin.slurp:
    src: /sys/kernel/security/lsm
  register: lsm_list

- name: Fail if Landlock is not active
  ansible.builtin.assert:
    that: "'landlock' in (lsm_list.content | b64decode)"
    success_msg: "Landlock is active: {{ lsm_list.content | b64decode }}"
    fail_msg: >-
      Landlock is NOT in the active LSM list ({{ lsm_list.content | b64decode }}).
      Add it to the lsm= kernel parameter and reboot. Do not continue: OpenShell
      will fall back to best_effort and report a healthy sandbox that enforces
      nothing.
