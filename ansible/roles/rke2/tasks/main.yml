---
# tar, not rpm: the installer would otherwise pick rpm on SUSE, which needs a
# distro-specific repo and puts the binary at /usr/bin/rke2 — so `creates`
# below would never match and every run would reinstall.
- name: Install RKE2 server
  ansible.builtin.shell: |
    set -o pipefail
    curl -sfL https://get.rke2.io | INSTALL_RKE2_METHOD=tar {% if rke2_version %}INSTALL_RKE2_VERSION={{ rke2_version }} {% endif %}sh -
  args:
    executable: /bin/bash
    creates: /usr/local/bin/rke2

- name: Start rke2-server
  ansible.builtin.systemd:
    name: rke2-server
    state: started
    enabled: true

- name: Wait for the node to become ready
  ansible.builtin.shell: |
    set -o pipefail
    /var/lib/rancher/rke2/bin/kubectl --kubeconfig /etc/rancher/rke2/rke2.yaml get nodes --no-headers
  args: {executable: /bin/bash}
  register: nodes
  until: "'Ready' in nodes.stdout"
  retries: 40
  delay: 15
  changed_when: false

- name: Install local-path StorageClass
  ansible.builtin.shell: |
    set -o pipefail
    /var/lib/rancher/rke2/bin/kubectl --kubeconfig /etc/rancher/rke2/rke2.yaml \
      apply -f https://raw.githubusercontent.com/rancher/local-path-provisioner/master/deploy/local-path-storage.yaml
  args: {executable: /bin/bash}
  changed_when: true

- name: Report cluster state
  ansible.builtin.debug:
    msg: >-
      RKE2 up. kubeconfig at /etc/rancher/rke2/rke2.yaml on the guest —
      it holds cluster admin credentials, so it is gitignored if you copy it out.
